<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient: Deep Forest & Emerald Green -->
    <linearGradient id="koodeBg" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B4332"/>
      <stop offset="50%" stop-color="#2D6A4F"/>
      <stop offset="100%" stop-color="#143626"/>
    </linearGradient>

    <!-- Warm Golden Care Glow -->
    <linearGradient id="warmSun" x1="256" y1="120" x2="256" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Caring Hands Gentle Gradient -->
    <linearGradient id="handsGrad" x1="160" y1="200" x2="352" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8F5E9"/>
      <stop offset="100%" stop-color="#C7E8D6"/>
    </linearGradient>

    <!-- Inner Reassurance Aura -->
    <radialGradient id="auraGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#52B788" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1B4332" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base for Mobile App Icon & Desktop Favicon -->
  <rect width="512" height="512" rx="128" fill="url(#koodeBg)"/>
  
  <!-- Subtle Contrast Rim Border for Accessibility -->
  <rect x="4" y="4" width="504" height="504" rx="124" stroke="#52B788" stroke-width="6" stroke-opacity="0.4"/>

  <!-- Background Soft Radial Aura -->
  <circle cx="256" cy="235" r="185" fill="url(#auraGlow)"/>

  <!-- Reassuring Inner Circle -->
  <circle cx="256" cy="235" r="150" fill="#FFFFFF" fill-opacity="0.06" stroke="#52B788" stroke-width="3" stroke-dasharray="10 8" stroke-opacity="0.5"/>

  <!-- 1. Warm Golden Heart & Sun Symbolizing Vitality & Family (Top Center) -->
  <path d="M256 142 C240 114 200 110 178 132 C154 156 156 194 186 226 C214 256 256 294 256 294 C256 294 298 256 326 226 C356 194 358 156 334 132 C312 110 272 114 256 142 Z" 
        fill="url(#warmSun)" 
        filter="drop-shadow(0px 8px 16px rgba(245, 158, 11, 0.45))"/>

  <!-- Inner Sparkle of Life inside Heart -->
  <circle cx="256" cy="180" r="18" fill="#FFFBEB"/>

  <!-- 2. Two Gentle Supporting Hands Cupping the Elder From Beneath (Left & Right) -->
  <!-- Left Supporting Hand -->
  <path d="M128 350 C140 280 180 230 224 235 C232 236 236 244 232 252 C216 280 188 320 188 360 C188 395 215 410 240 415 C215 425 180 422 155 400 C134 382 124 365 128 350 Z" 
        fill="url(#handsGrad)"/>

  <!-- Right Supporting Hand (Embracing) -->
  <path d="M384 350 C372 280 332 230 288 235 C280 236 276 244 280 252 C296 280 324 320 324 360 C324 395 297 410 272 415 C297 425 332 422 357 400 C378 382 388 365 384 350 Z" 
        fill="url(#handsGrad)"/>

  <!-- Protective Palm Base Embracing Together -->
  <path d="M185 385 C220 425 292 425 327 385 C310 405 275 418 256 418 C237 418 202 405 185 385 Z" 
        fill="#A7D7C5"/>

  <!-- 3. Distinctive Malayalam Ligature Motif 'കൂ' (Koo for Koode) in Warm White -->
  <g transform="translate(256, 315) scale(0.95)" text-anchor="middle">
    <!-- Gentle supportive curve / smile representing comfort -->
    <path d="M-60 10 C-30 45 30 45 60 10" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <!-- Supporting dots of companionship (Elder + Companion side by side) -->
    <circle cx="-38" cy="-5" r="9" fill="#FFFFFF"/>
    <circle cx="38" cy="-5" r="9" fill="#FFFFFF"/>
  </g>
</svg>
